/* ============================================================
   MundialBet Club 2026 — Token layer
   Híbrido: tipografía + espaciado + sombras de Motorra,
   paleta Trionda dark + mascotas FIFA 2026 del brief.
   ============================================================ */
:root {
  /* — Fuentes (Motorra) — */
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body:    'Manrope', system-ui, -apple-system, sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, Menlo, monospace;

  /* — Paleta Trionda (brief) — ACTUALIZADA PARA LUMINOSIDAD */
  --bg:          #0D1F3C;   /* cielo azul oscuro */
  --surface-1:   #1A3A5C;
  --surface-2:   #2A5A7C;
  --surface-3:   #3A6A8C;
  --border:      #2A5A7C;
  --border-2:    #4A7A9C;

  --mex:         #00843D;  --mex-light:  #00D466;   /* Zayu · México · verde brillante */
  --can:         #E63946;  --can-light:  #F77F88;   /* Maple · Canadá · rojo vivido */
  --usa:         #1B5E8F;  --usa-light:  #2E8BC0;   /* Clutch · EE.UU. · azul vibrante */
  --gold:        #FFB81C;  --gold-light: #FFD700;   /* trofeo / monedas - amarillo dorado */

  --text:        #FFFFFF;  /* blanco puro */
  --text-alt:    #E8F0F8;  /* blanco azulado */
  --muted:       #A8C5E0;  /* gris-azul claro */
  --muted-2:     #7A94B8;  /* gris-azul medio */
  --muted-3:     #5A7498;  /* gris-azul oscuro */

  /* — Roles semánticos — */
  --success:     var(--mex-light);
  --success-bg:  rgba(0,200,90,0.12);
  --danger:      var(--can-light);
  --danger-bg:   rgba(232,64,64,0.12);
  --info:        var(--usa-light);
  --info-bg:     rgba(74,144,226,0.12);
  --coin:        var(--gold);
  --coin-bg:     rgba(212,175,55,0.12);

  /* — Escala tipográfica (Motorra) — */
  --t-3xs: 11px; --t-2xs: 12px; --t-xs: 13px; --t-sm: 14px; --t-md: 15px;
  --t-lg: 17px;  --t-xl: 20px;  --t-2xl: 24px; --t-3xl: 30px; --t-4xl: 38px;
  --t-5xl: 48px; --t-6xl: 64px;

  /* — Espaciado (Motorra, base 4px) — */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
  --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px; --sp-16: 64px;

  /* — Radios (Motorra) — */
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px; --r-2xl: 28px; --r-pill: 9999px;

  /* — Sombras (Motorra, oscurecidas) — */
  --sh-1: 0 1px 2px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04);
  --sh-2: 0 4px 12px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.04);
  --sh-3: 0 10px 28px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
  --sh-4: 0 20px 48px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
  --glow-gold: 0 0 0 1px rgba(212,175,55,0.5), 0 0 20px rgba(212,175,55,0.25);
  --glow-green: 0 0 0 1px rgba(0,200,90,0.5), 0 0 18px rgba(0,200,90,0.22);

  /* — Motion (Motorra) — */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --dur-fast: 140ms; --dur-base: 220ms; --dur-slow: 380ms;
}

/* — Animaciones globales — */

@keyframes mb-pop { 0% { transform: scale(0.9); opacity: 0; } 60% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }

@keyframes mb-spin360 { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }
@keyframes mb-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes mb-shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }

<script>
  // Splash: espera mínimo de tiempo + que Firebase resuelva el login,
  // así el usuario nunca ve la pantalla "no autenticado" brevemente.
  var __mbSplashT0 = Date.now();
  var __mbSplashMin = /android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent || '') ? 300 : 0;
  var __mbAuthReady = false;
  window.__mbHideSplash = function (force) {
    var s = document.getElementById('mb-splash');
    if (!s) return;
    var elapsed = Date.now() - __mbSplashT0;
    if (!force && elapsed < __mbSplashMin) {
      setTimeout(function () { window.__mbHideSplash(); }, __mbSplashMin - elapsed);
      return;
    }
    if (!force && !__mbAuthReady) {
      // Espera el evento mb-auth-ready (disparado en mb-firebase.js)
      return;
    }
    s.classList.add('mb-hide');
    setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 600);
  };
  // Cuando Firebase resuelve el primer onAuthStateChanged, oculta el splash
  window.addEventListener('mb-auth-ready', function () {
    __mbAuthReady = true;
    window.__mbHideSplash();
  });
  // Respaldo: si Firebase falla o tarda más de 5 s, oculta igual.
  setTimeout(function () { window.__mbHideSplash(true); }, 5000);
</script>

<!-- Llena el splash con las banderas de las 48 selecciones (clickeables -> ficha) -->
<script>
(function () {
  function renderSplashFlags() {
    try {
      var c = document.querySelector('#mb-splash .flags');
      var G = window.MB_WC && window.MB_WC.GROUPS;
      if (!c || !G) return;

      var staticFx = (window.MB && window.MB.WC_FIXTURES) || [];
      var dynFx = window.MB_dynFixtures || [];
      if (!dynFx.length) {
        try {
          var cached = JSON.parse(localStorage.getItem('mb_dynfx_cache') || '[]');
          if (cached.length) dynFx = cached;
        } catch (e) {}
      }
      var allFx = staticFx.concat(dynFx);
      var codesFor = function (stage) {
        var set = {};
        allFx.filter(function (m) { return m.stage === stage; }).forEach(function (m) {
          if (m.homeCode) set[m.homeCode] = true;
          if (m.awayCode) set[m.awayCode] = true;
        });
        return set;
      };
      var r32Codes = codesFor('r32'), r16Codes = codesFor('r16'), qfCodes = codesFor('qf'), sfCodes = codesFor('sf'), finCodes = codesFor('final');
      var hasR32 = Object.keys(r32Codes).length > 0, hasR16 = Object.keys(r16Codes).length > 0;
      var hasQf = Object.keys(qfCodes).length > 0, hasSf = Object.keys(sfCodes).length > 0, hasFin = Object.keys(finCodes).length > 0;
      // Elimina en la ronda más avanzada de la que el equipo NO forma parte
      // (progresivo: si ya hay cuartos definidos, quien no esté ahí quedó afuera en octavos, etc.)
      var isEliminated = function (code) {
        if (hasFin) return !finCodes[code];
        if (hasSf) return !sfCodes[code];
        if (hasQf) return !qfCodes[code];
        if (hasR16) return !r16Codes[code];
        if (hasR32) return !r32Codes[code];
        return false;
      };

      c.innerHTML = '';
      Object.keys(G).forEach(function (k) {
        G[k].forEach(function (t) {
          var name = t[0], code = t[1];
          var eliminated = isEliminated(code);

          var wrap = document.createElement('span');
          wrap.style.cssText = 'position:relative;display:inline-flex;align-items:center;justify-content:center;';

          var img = document.createElement('img');
          img.src = 'https://flagcdn.com/h40/' + code + '.png';
          img.alt = name; img.title = name; img.style.cursor = 'pointer';
          img.style.height = '14px'; img.style.width = 'auto';
          img.style.borderRadius = '2px';
          img.style.boxShadow = '0 1px 3px rgba(0,0,0,0.55)';
          img.style.transition = 'opacity .2s, filter .2s';

          if (eliminated) {
            img.style.opacity = '0.28';
            img.style.filter = 'grayscale(1)';
          }

          img.addEventListener('click', function (ev) {
            ev.stopPropagation();
            window.__mbPendingTeam = name;
            img.style.outline = '2px solid #F0CE5A';
            img.style.transform = 'scale(1.25)';
            if (window.__mbOpenTeamByName) window.__mbOpenTeamByName(name);
          });

          wrap.appendChild(img);
          c.appendChild(wrap);
        });
      });
    } catch (e) {}
  }
  renderSplashFlags();
  // Si el splash sigue visible cuando llegan las fixtures dinámicas (R16+), re-pinta.
  window.addEventListener('mb-dynfx-updated', function () {
    if (document.getElementById('mb-splash')) renderSplashFlags();
  });
})();
</script>

<!-- Bootstrap responsive: escritorio (>=1024px) -> AppWeb, móvil -> App -->
<script type="text/babel">
function Root() {
  const mq = window.matchMedia('(min-width: 1024px)');
  const [wide, setWide] = React.useState(mq.matches);
  React.useEffect(() => {
    const on = () => setWide(mq.matches);
    mq.addEventListener ? mq.addEventListener('change', on) : mq.addListener(on);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', on) : mq.removeListener(on); };
  }, []);
  // Los launchers (ayuda, ficha de equipo, etc.) pueden definirse un instante
  // después que Root (orden de carga de los <script>). Reintentamos el render
  // hasta que estén disponibles para que SIEMPRE queden montados.
  const [, force] = React.useState(0);
  React.useEffect(() => {
    const allReady = function () { return window.MB_HelpLauncher && window.MB_TeamMembersLauncher; };
    if (allReady()) return undefined;
    const t = setInterval(function () {
      if (allReady()) { force(function (x) { return x + 1; }); clearInterval(t); }
    }, 80);
    return function () { clearInterval(t); };
  }, []);
  // Si la app principal (App o AppWeb) aún no cargó al primer render (Babel
  // compila los scripts externos de forma asíncrona), reintentar hasta que
  // el componente correcto esté disponible para no renderizar undefined.
  React.useEffect(function () {
    var needed = wide ? 'AppWeb' : 'App';
    if (window[needed]) return undefined;
    var t = setInterval(function () {
      if (window[needed]) { force(function (x) { return x + 1; }); clearInterval(t); }
    }, 80);
    return function () { clearInterval(t); };
  }, [wide]);
  const Cmp = (wide && window.AppWeb) ? window.AppWeb : window.App;
  const AdminLauncher = window.MB_AdminLauncher;
  const TeamGate = window.MB_TeamGate;
  const HelpLauncher = window.MB_HelpLauncher;
  const TeamMembers = window.MB_TeamMembersLauncher;
  const Figuritas = window.MB_FiguritasLauncher;
  const OfflineBanner = window.MB_OfflineBanner;
  if (typeof Cmp !== 'function') {
    return React.createElement('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100vh', background: '#06080F' } },
      React.createElement('span', { style: { width: 8, height: 8, borderRadius: '50%', background: '#FFB81C', animation: 'mb-pulse-live 1s ease infinite' } })
    );
  }
  return (
    <React.Fragment>
      {OfflineBanner ? <OfflineBanner /> : null}
      <Cmp />
      {AdminLauncher ? <AdminLauncher /> : null}
      {TeamGate ? <TeamGate /> : null}
      {HelpLauncher ? <HelpLauncher /> : null}
      {TeamMembers ? <TeamMembers /> : null}
      {Figuritas ? <Figuritas /> : null}
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('stage')).render(<Root />);
// La app ya montó: desvanece el splash en el próximo frame.
requestAnimationFrame(function () { window.__mbHideSplash(); });
</script>

<!-- Service Worker (PWA / instalable) con AUTO-ACTUALIZACIÓN -->
<script>
if ('serviceWorker' in navigator) {
  // Si ya había una versión controlando la página y entra una nueva, recarga
  // automáticamente para tomar el código nuevo (no en la 1ª instalación).
  var __hadController = !!navigator.serviceWorker.controller;
  var __reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (__reloading || !__hadController) return;
    __reloading = true;
    window.location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      // Revisa si hay versión nueva: al cargar, al volver a la pestaña y cada 60s.
      const check = () => reg.update().catch(() => {});
      check();
      setInterval(check, 60000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
    }).catch((err) => console.warn('SW registro falló:', err));
  });
}
</script>
</body>
</html>
