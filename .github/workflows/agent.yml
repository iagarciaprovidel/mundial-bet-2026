name: Agente MundialBet

on:
  # Cron desactivado: el Mundial 2026 terminó (campeón España, 19-jul) y ya no
  # hay partidos que trackear. Corría cada 5 min las 24h consumiendo lecturas/
  # escrituras de Firestore sin necesidad, generando costo real sin motivo.
  # Para reactivarlo (otro torneo, temporada nueva, etc.) descomentar el bloque
  # `schedule` de abajo.
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:          # permite ejecutarlo a mano desde la pestaña Actions
    inputs:
      mode:
        description: 'Escribe "discover" para sólo listar partidos (no escribe nada).'
        required: false
        default: ''

concurrency:
  group: agente-mundialbet
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del agente
        working-directory: agent
        run: npm install --no-audit --no-fund

      - name: Generar fixtures (desde wc2026.js)
        working-directory: agent
        run: node gen-fixtures.js

      - name: Ejecutar agente
        working-directory: agent
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          BONUS_DRY_RUN: ${{ vars.BONUS_DRY_RUN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WC_COMP: ${{ vars.WC_COMP }}
        run: node index.js ${{ github.event.inputs.mode }}
